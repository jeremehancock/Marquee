schema: spec-driven

# Project context shown to AI when creating artifacts.
context: |
  Project: Marquee — a self-hosted web app for managing custom media posters
  for a Plex library (movies, TV shows, TV seasons, collections). It imports
  posters from Plex, lets users customize them (upload from disk/URL or fetch
  from TMDB/fanart.tv/TheTVDB), and syncs them back to Plex with poster
  locking. Ships as a single Docker image. This is a clean-room rewrite of an
  older monolithic PHP app ("Posteria"); there is no backward-compatibility
  requirement with the old on-disk layout.

  Tech stack:
    - PHP 8.4 (composer requires >=8.4 and pins platform 8.4.0, matching the
      runtime image and CI), Composer, PSR-4 autoload (App\).
    - Slim 4 (PSR-7 / PSR-15) for routing and middleware.
    - Twig for server-rendered templates; Alpine.js + ES modules for
      interactivity. No Node build step in the runtime image.
    - Guzzle (PSR-18) for outbound HTTP (Plex, posteria.app API).
    - SQLite via PDO for metadata (library tracking, Plex id mapping, lock and
      import state). Poster image files live on disk under /config/posters.
    - Monolog for logging to /config/data.
    - Docker: LinuxServer Alpine-nginx base with s6-overlay + cron.

  Conventions:
    - strict_types=1 in every PHP file; PSR-12 style (enforced by PHP-CS-Fixer).
    - Thin controllers -> service classes -> value objects. No business logic
      in templates or the front controller.
    - All configuration comes from environment variables, read once into typed
      config objects at bootstrap. Never call getenv() deep in the code. The
      Plex token alone comes from the connection store written by signing in to
      Plex, never from the environment; PLEX_TOKEN is read only to report that
      it is obsolete. Resolution still happens once at bootstrap.
    - Every capability is defined by an OpenSpec spec before it is built.
    - PHPStan max level and PHPUnit must pass in CI on every push.

  External dependency (not built here):
    - posteria.app Marquee API — a hosted service (owned by the maintainer) that
      resolves a title to a single work and returns that work's poster
      candidates from TMDB / fanart.tv / TheTVDB, ranked best-first. Marquee
      calls it; it is not part of this repo.

  Capability map. Every capability has a spec in openspec/specs/; a change
  MUST target one of these rather than inventing a capability named after the
  change itself:
    - application-shell   (bootstrap, routing, config, error handling, health)
    - settings            (the runtime settings store; how configuration is
                           persisted, seeded from the environment, and resolved
                           into the typed config objects at bootstrap, plus the
                           reporting of superseded environment variables)
    - authentication      (Plex sign-in as the login, owner-only, sessions)
    - poster-library      (categories, listing, pagination, presentation,
                           pointer/touch actions, responsive layout, delete)
    - search              (specific, article-aware, live search)
    - plex-import         (type-first import, skip-unchanged, item mapping,
                           filenames, library tracking)
    - plex-export         (upload to Plex, poster locking, Kometa overlay label)
    - poster-editing      (change in place, re-send, fetch, download, copy)
    - poster-sources      (candidate posters to change to: Plex Posters, the
                           artwork the connected server already holds for an
                           item; and Find Posters via posteria.app:
                           TMDB/fanart.tv/TheTVDB)
    - auto-import         (scheduled cron import, per-type toggles, exclusions)
    - orphan-detection    (detect + delete orphaned posters)
    - poster-wall         (full-screen rotating wall, random batches)
    - visual-design       (the design token contract, surface layering and
                           translucency, pointer/focus feedback, app-wide
                           reduced motion; how things look, not what they do)
    - pwa                 (installable manifest, offline assets, version check)
    - release-publishing  (branch -> Docker tag, VERSION-driven releases;
                           build/release behavior, not an app capability)

  Note: posters enter the library only through plex-import. There is no
  add-a-poster path; uploading a file or URL is a mode of changing an existing
  poster (poster-editing).

# Per-artifact rules
rules:
  proposal:
    - Keep the Why section focused on user value, not implementation detail.
  # `specs`, not `spec`: the artifact id comes from the schema, and a key that
  # does not match one is dropped with a warning rather than applied.
  specs:
    - Scenarios MUST use exactly four hashtags (#### Scenario:).
    - Use SHALL/MUST for normative requirements.
