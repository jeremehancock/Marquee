name: CI

# Push-only: every commit is built once, on any branch. Pull requests do NOT
# trigger CI — GitHub attaches check runs to the commit SHA, so the push-CI
# result is visible on the PR without a second, redundant run. This keeps a
# single pushed commit to exactly one CI run (and therefore one publish),
# with no skipped or cancelled duplicate. Trade-off: external fork PRs get no
# CI here, which is acceptable for this solo dev -> main flow.
on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Analyse · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, gd, pdo_sqlite, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json / composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit

  docker:
    name: Build image · Smoke test (${{ matrix.arch }})
    # Every architecture we publish, each on its own hardware: an arm64-only
    # fault (an extension that will not load, a library missing on that
    # platform) is invisible to an amd64 test. Publishing waits for this whole
    # run, so a failure on either blocks the commit from being published.
    runs-on: ${{ matrix.runner }}
    strategy:
      # Report both architectures even when one fails; never cancel the other.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            machine: x86_64
            runner: ubuntu-latest
          - arch: arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t marquee:ci .

      - name: Run container and probe health
        run: |
          # No credentials: the health endpoint is public, and Marquee is
          # entered by signing in to Plex, which this probe cannot do.
          # Non-default PUID/PGID/TZ, so the next step can tell they were applied.
          docker run -d --name marquee -p 8080:80 \
            -e PUID=1234 -e PGID=1235 -e TZ=America/Denver marquee:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "Health check passed"; exit 0
            fi
            sleep 2
          done
          echo "Health check never succeeded"; docker logs marquee; exit 1

      - name: Check services, ownership, timezone and the FPM listener
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          # /health only proves nginx and PHP answer. A dead cron, a wrong owner
          # or a wrong timezone all look healthy from outside.
          set -x
          # The image built for this runner's architecture, with the extensions
          # Marquee compiles in actually loading on it.
          test "$(docker exec marquee uname -m)" = "$MACHINE"
          docker exec marquee php -r 'exit(extension_loaded("gd") && extension_loaded("intl") ? 0 : 1);'
          for svc in svc-php-fpm svc-nginx svc-cron; do
            docker exec marquee s6-svstat "/run/service/$svc" | grep -q '^up '
          done
          docker exec marquee grep -qx '0 \* \* \* \* /app/auto-import.sh' /etc/crontabs/abc
          test "$(docker exec marquee stat -c '%u:%g' /config/data)" = "1234:1235"
          # nginx buffers large responses here as abc; a wrong owner truncates
          # them only for slow clients, so nothing else in this job would notice.
          test "$(docker exec marquee stat -c '%u:%g' /var/lib/nginx/tmp)" = "1234:1235"
          test "$(docker exec marquee date +%Z)" != "UTC"
          test "$(docker exec marquee php -r 'echo date_default_timezone_get();')" = "America/Denver"
          # PHP-FPM must listen on loopback only, never on every interface.
          listeners=$(docker exec marquee netstat -tln | awk '$4 ~ /:9000$/ { print $4 }')
          test "$listeners" = "127.0.0.1:9000"
