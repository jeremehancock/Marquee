# nginx for Marquee. This file and http.d/marquee.conf belong to the image:
# every upgrade delivers them, unlike the earlier base image, which copied its
# config into /config/nginx/ once on first start and never again.

user abc;
worker_processes auto;
pcre_jit on;
pid /run/nginx/nginx.pid;
daemon off;

# Logs go to the container log (`docker logs`), not into /config.
error_log /dev/stderr warn;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    gzip_vary on;

    access_log /dev/stdout;

    # Owned by abc (see the Dockerfile), so uploads buffered here belong to the
    # same user as everything else.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
    proxy_temp_path /var/lib/nginx/tmp/proxy;
    scgi_temp_path /var/lib/nginx/tmp/scgi;
    uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;

    include /etc/nginx/http.d/*.conf;
}
