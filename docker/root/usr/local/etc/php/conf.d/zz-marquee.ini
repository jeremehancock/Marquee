; Marquee's PHP limits, on top of php.ini-production.
; Uploads and URL fetches of poster art, and long-running Plex imports.
upload_max_filesize = 20M
post_max_size = 21M
memory_limit = 256M
max_execution_time = 600

; Don't advertise the PHP version in an X-Powered-By header on every response.
expose_php = Off
