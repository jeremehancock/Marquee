; The only FPM configuration in the image: the official image's pool files are
; removed in the Dockerfile so nothing else can define a second listener.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = abc
group = abc

; Loopback only. nginx is the sole client, in the same container; listening on
; every interface would expose FPM to any container on the same network.
listen = 127.0.0.1:9000

; The application reads its environment-only variables (PLEX_SERVER_URL,
; DATA_DIR, ...) through the worker environment.
clear_env = no

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; PHP warnings and errors reach `docker logs`.
catch_workers_output = yes
decorate_workers_output = no
